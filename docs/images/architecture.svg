<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6070"/>
    </marker>
    <style>
      .t { font-size: 15px; fill: #14161a; }
      .s { font-size: 13px; fill: #474b54; }
      .h { font-size: 17px; font-weight: 700; fill: #14161a; }
      .lab { font-size: 13px; fill: #5b6070; font-style: italic; }
      .mono { font-family: Consolas, Menlo, monospace; font-size: 12.5px; fill: #1c5cab; }
      .line { stroke: #5b6070; stroke-width: 1.8; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="860" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#14161a">FlameLedger architecture</text>
  <text x="600" y="62" text-anchor="middle" class="s">One FastAPI web service on Render, serving the JSON API and the static pages</text>

  <!-- Browser -->
  <rect x="60" y="90" width="1080" height="110" rx="12" fill="#e3eefb" stroke="#1c5cab" stroke-width="1.5"/>
  <text x="84" y="120" class="h">Browser</text>
  <text x="84" y="142" class="s">Plain HTML, CSS and JavaScript · hand-drawn SVG charts · no CDN, strict Content-Security-Policy</text>
  <g>
    <rect x="84" y="155" width="240" height="32" rx="7" fill="#fff" stroke="#9db8dc"/><text x="204" y="176" text-anchor="middle" class="t">Evidence Ledger  /</text>
    <rect x="340" y="155" width="240" height="32" rx="7" fill="#fff" stroke="#9db8dc"/><text x="460" y="176" text-anchor="middle" class="t">Habitat Review  /review</text>
    <rect x="596" y="155" width="270" height="32" rx="7" fill="#fff" stroke="#9db8dc"/><text x="731" y="176" text-anchor="middle" class="t">Partial gravity &amp; FM2  /fm2</text>
    <rect x="882" y="155" width="234" height="32" rx="7" fill="#fff" stroke="#9db8dc"/><text x="999" y="176" text-anchor="middle" class="t">Open API docs  /docs</text>
  </g>

  <line class="line" x1="600" y1="200" x2="600" y2="240" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="612" y="226" class="lab">fetch JSON · download PDF / CSV</text>

  <!-- FastAPI -->
  <rect x="60" y="245" width="1080" height="120" rx="12" fill="#f3f1fb" stroke="#6250d6" stroke-width="1.5"/>
  <text x="84" y="275" class="h">FastAPI service</text>
  <text x="250" y="275" class="mono">main.py · api.py</text>
  <text x="84" y="300" class="mono">GET  /api/ledger  /api/ledger.csv  /api/coverage  /api/margins  /api/gravity-profile  /api/hypotheses  /api/sources  /api/presets  /api/health</text>
  <text x="84" y="324" class="mono">POST /api/review   /api/report   /api/report.pdf</text>
  <text x="84" y="350" class="s">Security headers · input validation (pydantic) · 10 reviews per minute per IP · errors never show stack traces</text>

  <line class="line" x1="600" y1="365" x2="600" y2="400" marker-end="url(#arr)"/>

  <!-- Modules -->
  <g>
    <rect x="60" y="405" width="200" height="120" rx="10" fill="#fff" stroke="#b9b6ab"/>
    <text x="160" y="432" text-anchor="middle" class="h">data.py</text>
    <text x="160" y="456" text-anchor="middle" class="s">Loads and validates</text>
    <text x="160" y="474" text-anchor="middle" class="s">the ledger at startup;</text>
    <text x="160" y="492" text-anchor="middle" class="s">unverified rows are</text>
    <text x="160" y="510" text-anchor="middle" class="s">never served</text>

    <rect x="280" y="405" width="200" height="120" rx="10" fill="#fff" stroke="#b9b6ab"/>
    <text x="380" y="432" text-anchor="middle" class="h">coverage.py</text>
    <text x="380" y="456" text-anchor="middle" class="s">Coverage grid, counts</text>
    <text x="380" y="474" text-anchor="middle" class="s">and gravity profile,</text>
    <text x="380" y="492" text-anchor="middle" class="s">computed from the data</text>

    <rect x="500" y="405" width="200" height="120" rx="10" fill="#fdecea" stroke="#c8312b" stroke-width="1.5"/>
    <text x="600" y="432" text-anchor="middle" class="h">rules.py</text>
    <text x="600" y="456" text-anchor="middle" class="s">Decides every verdict</text>
    <text x="600" y="474" text-anchor="middle" class="s">(red, orange, green,</text>
    <text x="600" y="492" text-anchor="middle" class="s">grey) from ledger rows</text>
    <text x="600" y="510" text-anchor="middle" class="s">only</text>

    <rect x="720" y="405" width="200" height="120" rx="10" fill="#eef4ff" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="820" y="432" text-anchor="middle" class="h">llm.py + verifier.py</text>
    <text x="820" y="456" text-anchor="middle" class="s">Gemini explains;</text>
    <text x="820" y="474" text-anchor="middle" class="s">verifier checks every</text>
    <text x="820" y="492" text-anchor="middle" class="s">number and source;</text>
    <text x="820" y="510" text-anchor="middle" class="s">cache + one retry</text>

    <rect x="940" y="405" width="200" height="120" rx="10" fill="#fff" stroke="#b9b6ab"/>
    <text x="1040" y="432" text-anchor="middle" class="h">report_pdf.py</text>
    <text x="1040" y="456" text-anchor="middle" class="s">PDF and Markdown</text>
    <text x="1040" y="474" text-anchor="middle" class="s">reports with clickable</text>
    <text x="1040" y="492" text-anchor="middle" class="s">NASA source links</text>
  </g>

  <!-- Gemini external -->
  <rect x="740" y="575" width="160" height="56" rx="28" fill="#fff" stroke="#2a78d6" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="820" y="600" text-anchor="middle" class="t" font-weight="600">Google Gemini</text>
  <text x="820" y="619" text-anchor="middle" class="s">optional</text>
  <line class="line" x1="820" y1="525" x2="820" y2="572" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <line class="line" x1="160" y1="525" x2="160" y2="660" marker-start="url(#arr)"/>
  <line class="line" x1="380" y1="525" x2="380" y2="660" marker-start="url(#arr)"/>
  <line class="line" x1="600" y1="525" x2="600" y2="660" marker-start="url(#arr)"/>

  <!-- Data -->
  <rect x="60" y="665" width="660" height="110" rx="12" fill="#fdf3dc" stroke="#e2b64a" stroke-width="1.5"/>
  <text x="84" y="695" class="h">Verified data</text>
  <text x="84" y="719" class="mono">data/ledger.csv  margins.csv  presets.csv  sources.csv  hypotheses.json</text>
  <text x="84" y="743" class="s">69 verified rows · 15 materials · 10 published margins · every row has its NTRS ID,</text>
  <text x="84" y="761" class="s">page or table and a quote under 15 words</text>

  <rect x="800" y="665" width="340" height="110" rx="12" fill="#fff" stroke="#7d8088" stroke-width="1.5"/>
  <text x="824" y="695" class="h">7 public NASA reports (NTRS)</text>
  <text x="824" y="719" class="s">BASS-II, WSTF flammability tests,</text>
  <text x="824" y="737" class="s">drop-tower partial gravity, FM2 (LPSC 2026)</text>
  <text x="824" y="759" class="s">Checked page by page: docs/EVIDENCE_AUDIT.md</text>
  <line class="line" x1="800" y1="720" x2="724" y2="720" marker-end="url(#arr)"/>
  <text x="762" y="711" text-anchor="middle" class="lab">hand-</text>
  <text x="762" y="740" text-anchor="middle" class="lab">checked</text>

  <text x="600" y="820" text-anchor="middle" class="s">Deployed as one Render web service (render.yaml, health check /api/health). Works fully without Gemini.</text>
  <text x="600" y="842" text-anchor="middle" class="s" font-style="italic">Research decision support, not certification.</text>
</svg>
